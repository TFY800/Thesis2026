<svg style="font-family:DejaVu Sans,sans-serif;font-size:14px" xmlns="http://www.w3.org/2000/svg" aria-label="Illustrative fixed assignment: A conflicts with B, C and D. Reference arrival times are 10, 5, 7 and 9 seconds. Their slack relative to 10 seconds is 0, 5, 3 and 1 seconds. A nearby drone E illustrates that the adjustment set can include initially safe neighbors." viewBox="0 0 736 315" height="315"><rect width="100%" height="100%" fill="white"/><title >Conflict count, time slack and local scope</title><desc >Illustrative fixed assignment: A conflicts with B, C and D. Reference arrival times are 10, 5, 7 and 9 seconds. Their slack relative to 10 seconds is 0, 5, 3 and 1 seconds. A nearby drone E illustrates that the adjustment set can include initially safe neighbors.</desc><defs ><marker id="tp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d6672"></path></marker></defs><ellipse cx="165.6" cy="140" rx="149.04" ry="113" fill="#edf2f7" stroke="#d7dde4" stroke-width="1"></ellipse><line x1="152.352" y1="125" x2="76.176" y2="60" stroke="#a04d39" stroke-width="1.5"></line><line x1="152.352" y1="125" x2="258.336" y2="65" stroke="#a04d39" stroke-width="1.5"></line><line x1="152.352" y1="125" x2="251.712" y2="190" stroke="#a04d39" stroke-width="1.5"></line><circle cx="152.352" cy="125" r="19" fill="#e8f0f8" stroke="#326b9e" stroke-width="1.5"></circle><text x="152.352" y="130" text-anchor="middle"><tspan x="152.352" dy="0">A</tspan></text><text x="152.352" y="164" text-anchor="middle" font-size="12" fill="#5d6672"><tspan x="152.352" dy="0">3 conflicts</tspan></text><circle cx="76.176" cy="60" r="19" fill="#e8f0f8" stroke="#326b9e" stroke-width="1.5"></circle><text x="76.176" y="65" text-anchor="middle"><tspan x="76.176" dy="0">B</tspan></text><text x="76.176" y="99" text-anchor="middle" font-size="12" fill="#5d6672"><tspan x="76.176" dy="0">1 conflict</tspan></text><circle cx="258.336" cy="65" r="19" fill="#e8f0f8" stroke="#326b9e" stroke-width="1.5"></circle><text x="258.336" y="70" text-anchor="middle"><tspan x="258.336" dy="0">C</tspan></text><text x="258.336" y="104" text-anchor="middle" font-size="12" fill="#5d6672"><tspan x="258.336" dy="0">1 conflict</tspan></text><circle cx="251.712" cy="190" r="19" fill="#e8f0f8" stroke="#326b9e" stroke-width="1.5"></circle><text x="251.712" y="195" text-anchor="middle"><tspan x="251.712" dy="0">D</tspan></text><text x="251.712" y="229" text-anchor="middle" font-size="12" fill="#5d6672"><tspan x="251.712" dy="0">1 conflict</tspan></text><circle cx="76.176" cy="205" r="19" fill="#ffffff" stroke="#d7dde4" stroke-width="1.5"></circle><text x="76.176" y="210" text-anchor="middle"><tspan x="76.176" dy="0">E</tspan></text><text x="76.176" y="240" text-anchor="middle" font-size="12"><tspan x="76.176" dy="0">nearby</tspan><tspan x="76.176" dy="19">no current conflict</tspan></text><text x="165.6" y="280" text-anchor="middle" font-size="12" fill="#5d6672"><tspan x="165.6" dy="0">Candidate neighborhood</tspan></text><text x="526.96" y="28" text-anchor="middle" font-size="12"><tspan x="526.96" dy="0">Fixed-assignment example: Tref = 10 s</tspan></text><text x="365.36" y="78" text-anchor="end"><tspan x="365.36" dy="0">A</tspan></text><rect x="375.36" y="65" width="303.2" height="20" fill="#edf2f7"></rect><rect x="375.36" y="65" width="303.2" height="20" fill="#326b9e" opacity="0.8"></rect><text x="678.56" y="104" text-anchor="end" font-size="12"><tspan x="678.56" dy="0">0 s slack</tspan></text><text x="673.56" y="79" text-anchor="end" font-size="12" fill="#ffffff"><tspan x="673.56" dy="0">10 s</tspan></text><text x="365.36" y="129" text-anchor="end"><tspan x="365.36" dy="0">B</tspan></text><rect x="375.36" y="116" width="303.2" height="20" fill="#edf2f7"></rect><rect x="375.36" y="116" width="151.6" height="20" fill="#326b9e" opacity="0.8"></rect><text x="678.56" y="155" text-anchor="end" font-size="12"><tspan x="678.56" dy="0">5 s slack</tspan></text><text x="521.96" y="130" text-anchor="end" font-size="12" fill="#ffffff"><tspan x="521.96" dy="0">5 s</tspan></text><text x="365.36" y="180" text-anchor="end"><tspan x="365.36" dy="0">C</tspan></text><rect x="375.36" y="167" width="303.2" height="20" fill="#edf2f7"></rect><rect x="375.36" y="167" width="212.24" height="20" fill="#326b9e" opacity="0.8"></rect><text x="678.56" y="206" text-anchor="end" font-size="12"><tspan x="678.56" dy="0">3 s slack</tspan></text><text x="582.6" y="181" text-anchor="end" font-size="12" fill="#ffffff"><tspan x="582.6" dy="0">7 s</tspan></text><text x="365.36" y="231" text-anchor="end"><tspan x="365.36" dy="0">D</tspan></text><rect x="375.36" y="218" width="303.2" height="20" fill="#edf2f7"></rect><rect x="375.36" y="218" width="272.88" height="20" fill="#326b9e" opacity="0.8"></rect><text x="678.56" y="257" text-anchor="end" font-size="12"><tspan x="678.56" dy="0">1 s slack</tspan></text><text x="643.24" y="232" text-anchor="end" font-size="12" fill="#ffffff"><tspan x="643.24" dy="0">9 s</tspan></text><text x="526.96" y="287" text-anchor="middle" font-size="12"><tspan x="526.96" dy="0">Conflict count suggests candidates.</tspan></text><text x="526.96" y="307" text-anchor="middle" font-size="12"><tspan x="526.96" dy="0">Slack helps compare their cost.</tspan></text></svg>