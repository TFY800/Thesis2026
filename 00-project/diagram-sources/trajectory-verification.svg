<svg style="font-family:DejaVu Sans,sans-serif;font-size:14px" xmlns="http://www.w3.org/2000/svg" aria-label="Independent checks cover task completion, dynamic limits, continuous-time separation and numerical coverage. Outcomes are pass, fail with a violation report, or unverified when coverage is insufficient." viewBox="0 0 736 342" height="342"><rect width="100%" height="100%" fill="white"/><title >Trajectory verification</title><desc >Independent checks cover task completion, dynamic limits, continuous-time separation and numerical coverage. Outcomes are pass, fail with a violation report, or unverified when coverage is insufficient.</desc><defs ><marker id="tp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d6672"></path></marker></defs><rect x="16" y="12" width="704" height="54" rx="4" fill="#e8f0f8" stroke="#d7dde4" stroke-width="1"></rect><text x="368" y="44" text-anchor="middle"><tspan x="368" dy="0">All candidate trajectories + constraints</tspan></text><polyline points="368,66 368,90" fill="none" stroke="#5d6672" stroke-width="1.5" marker-end="url(#tp-arrow)"></polyline><rect x="16" y="94" width="343" height="62" rx="4" fill="#ffffff" stroke="#d7dde4" stroke-width="1"></rect><text x="187.5" y="121" text-anchor="middle"><tspan x="187.5" dy="0">Targets and continuity</tspan><tspan x="187.5" dy="19">unique goals, valid endpoints</tspan></text><rect x="377" y="94" width="343" height="62" rx="4" fill="#ffffff" stroke="#d7dde4" stroke-width="1"></rect><text x="548.5" y="121" text-anchor="middle"><tspan x="548.5" dy="0">Motion limits</tspan><tspan x="548.5" dy="19">speed and turning acceleration</tspan></text><rect x="16" y="172" width="343" height="62" rx="4" fill="#ffffff" stroke="#d7dde4" stroke-width="1"></rect><text x="187.5" y="199" text-anchor="middle"><tspan x="187.5" dy="0">Mutual separation</tspan><tspan x="187.5" dy="19">same time, including hovering</tspan></text><rect x="377" y="172" width="343" height="62" rx="4" fill="#ffffff" stroke="#d7dde4" stroke-width="1"></rect><text x="548.5" y="199" text-anchor="middle"><tspan x="548.5" dy="0">Interval coverage</tspan><tspan x="548.5" dy="19">boundaries and interior extrema</tspan></text><polyline points="368,234 368,260" fill="none" stroke="#5d6672" stroke-width="1.5" marker-end="url(#tp-arrow)"></polyline><rect x="8" y="260" width="229.33333333333334" height="62" rx="4" fill="#e8f0f8" stroke="#d7dde4" stroke-width="1"></rect><text x="122.66666666666667" y="287" text-anchor="middle"><tspan x="122.66666666666667" dy="0">Pass</tspan><tspan x="122.66666666666667" dy="19">checked safe</tspan></text><rect x="253.33333333333334" y="260" width="229.33333333333334" height="62" rx="4" fill="#ffffff" stroke="#d7dde4" stroke-width="1"></rect><text x="368" y="287" text-anchor="middle"><tspan x="368" dy="0">Fail</tspan><tspan x="368" dy="19">violation report</tspan></text><rect x="498.6666666666667" y="260" width="229.33333333333334" height="62" rx="4" fill="#ffffff" stroke="#d7dde4" stroke-width="1"></rect><text x="613.3333333333334" y="287" text-anchor="middle"><tspan x="613.3333333333334" dy="0">Unverified</tspan><tspan x="613.3333333333334" dy="19">coverage incomplete</tspan></text></svg>