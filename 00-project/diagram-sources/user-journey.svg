<polyline points="530,214 495,214" fill="none" stroke="#657080" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="512" y="201" font-size="17" font-weight="400" text-anchor="middle" fill="#25303b"><tspan x="512" dy="0">Yes</tspan></text>
<polyline points="275,214 240,214" fill="none" stroke="#657080" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="785" y="322" width="475" height="70" rx="5" fill="#eef3f8" stroke="#b9c4d0" stroke-width="2"/>
<text x="1022.5" y="351.28" font-size="22" font-weight="400" text-anchor="middle" fill="#25303b"><tspan x="1022.5" dy="0">Read the message</tspan><tspan x="1022.5" dy="26.84">and edit relevant settings</tspan></text>
<polyline points="1150,251 1150,322" fill="none" stroke="#657080" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="1174" y="291" font-size="17" font-weight="400" text-anchor="middle" fill="#25303b"><tspan x="1174" dy="0">No</tspan></text>
<polyline points="640,251 640,288 850,288 850,322" fill="none" stroke="#657080" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="663" y="278" font-size="17" font-weight="400" text-anchor="middle" fill="#25303b"><tspan x="663" dy="0">No</tspan></text>
<polyline points="785,357 8,357 8,140 385,140 385,110" fill="none" stroke="#657080" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="640" y="421" font-size="20" font-weight="400" text-anchor="middle" fill="#657080"><tspan x="640" dy="0">The system keeps the current setup when the user retries.</tspan></text>
</svg>