="64" width="8" height="8" fill="#ffffff" stroke="#326b9e"></rect><circle cx="493.6" cy="68" r="3" fill="#326b9e"></circle><text x="546" y="124" text-anchor="middle" font-size="12" fill="#5d6672"><tspan x="546" dy="0">Slow down while moving</tspan></text><text x="190" y="157" text-anchor="middle" font-size="14" font-weight="500"><tspan x="190" dy="0">Smooth 3D detour</tspan></text><line x1="38" y1="205" x2="342" y2="205" stroke="#d7dde4" stroke-width="1.5" stroke-dasharray="4 4"></line><line x1="199.96" y1="181" x2="199.96" y2="228" stroke="#d7dde4" stroke-width="1.5"></line><path d="M 38 205 C 121 160 259 160 342 205" fill="none" stroke="#326b9e" stroke-width="2.5"></path><circle cx="38" cy="205" r="4" fill="#326b9e"></circle><rect x="338" y="201" width="8" height="8" fill="#ffffff" stroke="#326b9e"></rect><text x="190" y="261" text-anchor="middle" font-size="12" fill="#5d6672"><tspan x="190" dy="0">Change the curve shape</tspan></text><text x="546" y="157" text-anchor="middle" font-size="14" font-weight="500"><tspan x="546" dy="0">Detour + speed adjustment</tspan></text><line x1="394" y1="205" x2="698" y2="205" stroke="#d7dde4" stroke-width="1.5" stroke-dasharray="4 4"></line><line x1="555.96" y1="181" x2="555.96" y2="228" stroke="#d7dde4" stroke-width="1.5"></line><path d="M 394 205 C 477 160 615 160 698 205" fill="none" stroke="#326b9e" stroke-width="2.5"></path><circle cx="394" cy="205" r="4" fill="#326b9e"></circle><rect x="694" y="201" width="8" height="8" fill="#ffffff" stroke="#326b9e"></rect><circle cx="493.6" cy="181" r="3" fill="#326b9e"></circle><text x="546" y="261" text-anchor="middle" font-size="12" fill="#5d6672"><tspan x="546" dy="0">Adjust geometry and timing</tspan></text></svg>